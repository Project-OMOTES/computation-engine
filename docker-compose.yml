networks:
  omotes:
    driver: bridge
    name: omotes
#  mapeditor-net:
#    external: true

volumes:
  minio_data:
  postgres_data:
  influxdb_data:

services:
  omotes_influxdb:
    image: influxdb:1.7
    ports:
      - "${INFLUXDB_PORT}:${INFLUXDB_PORT}"
      - "${INFLUXDB_RPC_PORT}:${INFLUXDB_RPC_PORT}"
    networks:
      - omotes
#      - mapeditor-net
    environment:
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_HTTP_BIND_ADDRESS: :${INFLUXDB_PORT}
      INFLUXDB_BIND_ADDRESS: :${INFLUXDB_RPC_PORT}
      INFLUXDB_DB: omotes_timeseries
      INFLUXDB_HTTP_AUTH_ENABLED: true
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://omotes_influxdb:${INFLUXDB_PORT}/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro
      - influxdb_data:/var/lib/influxdb

  omotes_postgres: &omotes_postgres
    image: postgres:15.4
    restart: unless-stopped
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    volumes:
      - "postgres_data:/var/lib/postgresql/data/"
    expose:
      - "${POSTGRES_PORT}"
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - omotes
#      - mapeditor-net
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}

      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test:
        [ "CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-p", "${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web UI
    volumes:
      - minio_data:/data
    networks:
      - omotes
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-buckets:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z.hotfix.e98f1ead
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh
    networks:
      - omotes
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
      MINIO_BUCKETS: prefect-cache,prefect-artifacts,prefect-results
    entrypoint: /bin/sh -c "/init-buckets.sh"

  prefect-server:
    image: prefecthq/prefect:3.7.3-python3.11
    command: prefect server start
    networks:
      - omotes
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_PREFECT_USER_NAME}:${POSTGRES_PREFECT_USER_PASSWORD}@omotes_postgres:${POSTGRES_PORT}/prefect_server
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
      EXTRA_PIP_PACKAGES: prefect-docker
      PREFECT_SERVER_API_AUTH_STRING: "admin:password"
    depends_on:
      omotes_postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import requests; r = requests.get('http://localhost:4200/api/health'); exit(0 if r.ok else 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect-worker:
    image: prefecthq/prefect:3.7.3-python3.11
    command: >
      sh -c 'prefect worker start --pool docker-worker --type docker'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - omotes
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_SERVER_LEVEL: WARNING
      EXTRA_PIP_PACKAGES: prefect-docker
      PREFECT_API_AUTH_STRING: "admin:password"
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

